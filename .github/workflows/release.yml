name: Build & Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtmultimedia'
          tools: 'tools_cmake tools_mingw'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build
        run: |
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release

      - name: Run windeployqt
        run: |
          windeployqt --release --no-translations --no-opengl-sw --no-compiler-runtime build/NonsenseMusic.exe

      - name: Download yt-dlp
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "build/yt-dlp.exe"

      - name: Download FFmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
          Copy-Item "ffmpeg_extracted/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" "build/ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg_extracted", "ffmpeg.zip"

      - name: Build Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss

      - name: Get version
        id: version
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $short = $env:GITHUB_SHA.Substring(0, 7)
          echo "tag=v${date}-${short}" >> $env:GITHUB_OUTPUT
          echo "name=Build ${date} (${short})" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            Auto-built from latest commit on main.
            Installer includes yt-dlp and FFmpeg (downloaded during setup).
          files: Release_Installer/NonsenseMusic_Setup.exe
          draft: false
          prerelease: false
